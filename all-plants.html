const grid=document.getElementById('plantGrid');function card(p){const [name,cat,note,href,icon]=p;const photo=photoMap[name];const media=photo?`<span class="all-plant-icon photo"><img src="${photo}" alt="${name}" loading="lazy"></span>`:`<span class="all-plant-icon">${icon}</span>`;const search=(name+' '+cat+' '+note).toLowerCase();return `<a class="all-plant-card" href="${href}" data-search="${search.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${media}<div><span class="badge">${cat}</span><h3>${name}</h3><p>${note}</p></div></a>`}grid.innerHTML=plants.map(card).join('');const s=document.getElementById('globalSearch');const cards=[...document.querySelectorAll('.all-plant-card')];s.addEventListener('input',()=>{const q=s.value.toLowerCase().trim();cards.forEach(c=>c.style.display=!q||c.dataset.search.includes(q)?'flex':'none')});s.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=cards.find(c=>c.style.display!=='none');if(first)location.href=first.href}});async function upgradePhotos(){for(const c of cards){if(c.querySelector('.photo'))continue;const href=c.getAttribute('href');if(!href||href.includes('plant-care.html?'))continue;try{const r=await fetch(href,{cache:'no-store'});if(!r.ok)continue;const html=await r.text();const d=new DOMParser().parseFromString(html,'text/html');const img=[...d.querySelectorAll('main img, article img, .content img, img')].find(i=>{const src=i.getAttribute('src')||'';return src&&!/icon|logo|favicon/i.test(src)});if(!img)continue;const span=c.querySelector('.all-plant-icon');span.classList.add('photo');span.innerHTML=`<img src="${img.getAttribute('src')}" alt="${c.querySelector('h3').textContent}" loading="lazy">`;}catch(e){}}}upgradePhotos();</script><script src="nav-helper.js?v=4"></script></body></html>
