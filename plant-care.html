<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315D3F"><title>Plant Care · Lou's Garden Guide</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v3.css?v=4.7"><style>.care-wrap{max-width:860px;margin:0 auto;padding:28px 18px 90px}.care-card{background:#fff;border:1px solid #d6ddd3;border-radius:22px;padding:24px;box-shadow:0 8px 26px #243b2b12}.care-card h1{font:700 clamp(2.2rem,7vw,4rem) Georgia,serif;color:#315d3f;margin:.1rem 0 .5rem}.care-card .badge{display:inline-block;background:#e5efe2;color:#244832;border-radius:999px;padding:6px 11px;font-weight:800;margin-bottom:8px}.care-photo{width:100%;max-height:620px;object-fit:cover;border-radius:18px;margin:12px 0 16px}.photo-note{background:#f4f1e8;border-radius:12px;padding:11px 14px;margin:12px 0}.care-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.care-item{background:#f7f8f4;border:1px solid #dfe5dc;border-radius:16px;padding:16px}.care-item strong{display:block;color:#315d3f;margin-bottom:6px}.care-note{margin-top:18px;padding:14px 16px;border-left:5px solid #7e9b7a;background:#f3f7f1}@media(max-width:650px){.care-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="topbar"><a class="brand" href="index.html"><img src="icon-512.png" alt="Lou's Garden Guide"><div><strong>Lou’s Garden Guide</strong><small>Wayne, Maine</small></div></a></div><nav><div class="nav"><a href="index.html">Home</a><a href="all-plants.html">Plants</a><a href="journal.html">Photo Journal</a><a href="projects.html">Projects</a><a href="calendar.html">Calendar</a></div></nav></header><main class="care-wrap"><article class="care-card"><span class="badge" id="category">Plant Care</span><h1 id="plantName">Plant Care</h1><div id="photoArea"></div><p id="summary"></p><div class="care-grid"><div class="care-item"><strong>☀️ Light</strong><span id="light"></span></div><div class="care-item"><strong>💧 Water</strong><span id="water"></span></div><div class="care-item"><strong>🌱 Soil & Feeding</strong><span id="soil"></span></div><div class="care-item"><strong>✂️ Seasonal Care</strong><span id="season"></span></div><div class="care-item"><strong>🐛 Watch For</strong><span id="watch"></span></div><div class="care-item"><strong>📅 Maine Timing</strong><span id="timing"></span></div></div><div class="care-note" id="note"></div></article></main><script>
const DATA={
'Pink Mallow':['Flowers · Identification to Confirm','Provisional mallow identification.','Full sun to light shade.','Moderate water; allow the surface to dry slightly.','Well-drained average garden soil; light feeding only.','Deadhead for longer bloom or leave seed for volunteers.','Japanese beetles, rust and leaf spot.','Plant or divide in spring; cut back after frost.','Update the identification if the plant is confirmed later.'],
'Herbs':['Garden Vegetables · Herbs','General care for common culinary herbs.','Most culinary herbs prefer 6+ hours of sun.','Water when the upper soil begins to dry.','Well-drained soil; avoid overfeeding strongly flavored herbs.','Pinch and harvest often to keep plants bushy.','Aphids, spider mites, root rot and bolting.','Set tender herbs out after frost.','Individual herbs may have somewhat different needs.'],
'Trailing Jade Plant':['Indoor Plants','Trailing succulent houseplant.','Bright indirect light with gentle direct sun.','Allow the mix to dry substantially between waterings.','Fast-draining succulent mix; feed lightly in spring and summer.','Pinch or prune to control length and encourage branching.','Root rot and mealybugs.','Reduce watering during low-light winter months.','Keep the pot well drained.'],
'Kale':['Garden Vegetables · Leafy Green','Cold-tolerant leafy green suited to spring and fall.','Full sun to light shade.','Keep evenly moist for tender leaves.','Fertile soil with compost.','Harvest outer leaves first and keep the center growing.','Cabbage worms, flea beetles, aphids and slugs.','Plant early spring and again in midsummer for fall harvest.','Inspect leaf undersides regularly for caterpillars and eggs.'],
'Lettuce':['Garden Vegetables · Leafy Green','Cool-season crop for spring and fall.','Full sun in cool weather; afternoon shade helps as temperatures rise.','Consistent shallow moisture keeps leaves tender.','Loose, fertile soil with compost.','Harvest outer leaves or whole heads before bolting.','Slugs, aphids, tip burn and heat-induced bolting.','Sow early spring and again late summer.','Succession sow every 1–2 weeks for a steady supply.'],
'Pumpkin':['Garden Vegetables · Vine Crop','Long-season warm-weather vine requiring space, sun and pollination.','Full sun.','Deep regular watering at soil level.','Rich, well-drained soil with compost.','Guide vines into open space and protect developing fruit from prolonged wet soil.','Cucumber beetles, squash bugs, vine borers and powdery mildew.','Start indoors in May or direct sow after frost when soil is warm.','Check leaf undersides regularly for pests and eggs.'],
'Rhubarb':['Garden Vegetables · Perennial','Long-lived perennial grown for spring stalks.','Full sun to light shade.','Water during dry periods, especially after harvest.','Deep fertile well-drained soil; top-dress with compost in spring.','Harvest established plants in spring, then stop so crowns rebuild reserves.','Crown rot in wet soil and weak growth from overharvest.','Divide in early spring or fall.','Only the stalks are eaten; leaves should not be consumed.'],
'Swiss Chard':['Garden Vegetables · Leafy Green','Productive leafy green that tolerates cool and warm weather.','Full sun to light shade.','Keep evenly moist.','Fertile, well-drained soil with compost.','Harvest outer leaves first.','Leaf miners, slugs, flea beetles and leaf spot.','Direct sow in spring and harvest into fall.','Regular harvesting encourages fresh leaves.'],
'Winter Squash':['Garden Vegetables · Vine Crop','Warm-season vine crop grown to full maturity for storage.','Full sun.','Water deeply at soil level; reduce as fruits mature.','Rich, well-drained soil with compost.','Keep fruit off persistently wet soil and cure before storage.','Squash bugs, cucumber beetles, vine borers and powdery mildew.','Start indoors in May or sow after frost; harvest before hard frost.','Leave a short stem attached at harvest.'],
'Zucchini':['Garden Vegetables · Summer Squash','Fast-producing summer squash harvested young and tender.','Full sun.','Deep, consistent watering at soil level.','Rich, well-drained soil.','Harvest every 1–2 days during peak production.','Squash bugs, cucumber beetles, vine borers and powdery mildew.','Direct sow after frost or start indoors a few weeks earlier.','Frequent harvest keeps plants producing.'],
'Blueberry':['Fruit & Berries · Blueberry','Acid-loving perennial berry shrub.','Full sun for best fruiting.','Keep roots evenly moist but not saturated.','Acidic soil around pH 4.5–5.5; use acid-loving fertilizer as directed.','Prune older wood in late winter and maintain bird protection.','Birds, mummy berry, spotted wing drosophila and drought stress.','Prune late winter; mulch and feed in spring; harvest as berries ripen.','Protect shallow roots with mulch and avoid deep cultivation.'],
'Grapes':['Fruit & Berries · Grapevine','Perennial fruiting vine trained on an arbor.','Full sun with good air movement.','Deep water during dry periods, especially while fruit is sizing.','Well-drained soil; avoid excessive nitrogen.','Dormant prune heavily and train permanent arms with spaced fruiting shoots.','Black rot, Japanese beetles, birds and dense canopy.','Major pruning in late winter; manage canopy during summer.','An open canopy improves sunlight, airflow and fruit quality.'],
'Honeyberry':['Fruit & Berries · Honeyberry','Very hardy early-ripening berry shrub.','Full sun to light shade.','Keep evenly moist during establishment and fruit development.','Well-drained soil enriched with organic matter.','Prune lightly after establishment, removing old or crowded stems.','Birds and drought stress.','Plant in spring or fall; fruit ripens very early.','Two compatible varieties generally improve pollination and yield.'],
'Raspberry':['Fruit & Berries · Raspberry','Perennial cane fruit.','Full sun.','Consistent moisture during flowering and fruiting.','Fertile, well-drained soil with mulch.','Remove dead spent canes and thin crowded new canes.','Japanese beetles, cane diseases, birds and spotted wing drosophila.','Prune while dormant and after harvest according to bearing type.','Good spacing and airflow reduce disease.'],
'Thorny Blackberry':['Fruit & Berries · Blackberry','Once-bearing thorny cane fruit.','Full sun.','Keep evenly moist during flowering and fruit fill.','Well-drained moderately fertile soil with mulch.','After harvest remove canes that fruited and retain healthy new canes.','Japanese beetles, cane diseases, birds and spotted wing drosophila.','Prune spent floricanes after harvest.','Next year’s crop comes from new canes grown this season.'],
'Annual Flowers':['Flowers · Annuals','Seasonal flowering plants grown for one season of color.','Most need full sun, though some tolerate part shade.','Water according to plant needs.','Well-drained soil and regular feeding for heavy bloomers.','Deadhead and trim leggy growth to extend flowering.','Aphids, slugs, mites and fungal leaf spots.','Plant after frost unless species is cold tolerant.','Use each named annual’s specific care page when available.'],
'Peony':['Flowers · Perennial','Long-lived perennial valued for large spring flowers.','Full sun, ideally 6+ hours.','Water deeply during dry spells.','Fertile well-drained soil; keep crown eyes close to surface.','Support heavy blooms if needed; cut foliage after frost.','Botrytis blight, powdery mildew and flopping stems.','Best planted or divided in early fall.','Peonies may bloom poorly if planted too deeply.'],
'Penstemon':['Flowers · Pollinator Perennial','Flowering perennial valued by pollinators.','Full sun.','Moderate water while establishing; avoid constantly wet soil.','Well-drained soil with modest fertility.','Deadhead for tidiness or leave some seed heads.','Root rot in wet soil, powdery mildew and slugs.','Plant in spring or early fall; cut dead stems in spring.','Good drainage is important for winter survival.'],
'Petunia':['Flowers · Annual','Heavy-blooming annual for beds and containers.','Full sun for strongest flowering.','Water when upper soil begins to dry.','Well-drained soil with regular feeding.','Trim leggy stems and remove spent flowers as needed.','Aphids, budworms, slugs and root rot.','Set outdoors after frost; blooms until hard frost.','A midsummer trim often restores fuller growth and flowering.'],
'Pollinator Plants':['Flowers · Pollinator Garden','Plants selected to provide nectar, pollen and habitat.','Many top pollinator plants prefer full sun.','Water new plantings until established.','Match soil and drainage to each species and avoid unnecessary fertilizer.','Leave some seed heads and hollow stems through winter when practical.','Avoid broad-spectrum insecticides when pollinators are active.','Plant perennials in spring or early fall.','A mix of flower shapes and bloom periods supports more species.']};
const PHOTO={'Trailing Jade Plant':'elephant-bush-1.jpg','Herbs':'basil-1.jpg','Kale':'garden-2026-kale.jpg','Pumpkin':'garden-2026-squash-yellowing-02.jpg','Rhubarb':'garden-2026-rhubarb.jpg','Winter Squash':'garden-2026-squash-yellowing-03.jpg','Zucchini':'garden-2026-summer-squash.jpg','Blueberry':'fruit-and-berry-patch-01.jpg','Grapes':'garden-2026-grapes.jpg','Thorny Blackberry':'garden-2026-blackberries.jpg','Annual Flowers':'flowers-and-perennials-04.jpg','Peony':'peony-card.svg','Petunia':'flowers-and-perennials-04.jpg','Pollinator Plants':'garden-2026-pollen-bee.jpg'};
const qs=new URLSearchParams(location.search),name=qs.get('plant')||'Plant Care',d=DATA[name]||['Plant Care','This plant is recorded in Lou’s handbook.','See the plant category page.','See the plant category page.','See the plant category page.','See the plant category page.','Observe regularly for pests or stress.','Follow the seasonal notes in the handbook.','Use Back to return to the plant list.'];document.title=name+' · Lou\'s Garden Guide';document.getElementById('plantName').textContent=name;document.getElementById('category').textContent=d[0];document.getElementById('summary').textContent=d[1];document.getElementById('light').textContent=d[2];document.getElementById('water').textContent=d[3];document.getElementById('soil').textContent=d[4];document.getElementById('season').textContent=d[5];document.getElementById('watch').textContent=d[6];document.getElementById('timing').textContent=d[7];document.getElementById('note').textContent=d[8];const p=PHOTO[name],area=document.getElementById('photoArea');if(p){area.innerHTML=`<img class="care-photo" src="${p}" alt="${name} from Lou's plant collection">`;}else{area.innerHTML='<div class="photo-note"><strong>Actual photo still needed:</strong> No confirmed matching photograph is currently stored for this plant, so a general garden picture is not being substituted.</div>';}</script><script src="nav-helper.js?v=4"></script></body></html>
