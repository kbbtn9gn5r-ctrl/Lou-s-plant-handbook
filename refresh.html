<!doctype html><meta charset="utf-8"><title>Refresh Lou's Garden</title>
<style>body{font-family:-apple-system;padding:30px;max-width:700px;margin:auto;background:#f5f0e4;color:#2c5a3c}button{padding:14px 18px;border:0;border-radius:12px;background:#2c5a3c;color:white;font-weight:700}</style>
<h1>Refresh Lou's Garden</h1><p>Tap the button once after uploading this update. It removes the older saved website version.</p>
<button onclick="reset()">Refresh Website</button><p id="msg"></p>
<script>
async function reset(){if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister();}
const keys=await caches.keys();for(const k of keys)await caches.delete(k);
document.getElementById('msg').textContent='Done. Reopen the home page now.';}
</script>
